      expr: |
        (
            max(slo:sli_error:ratio_rate5m{sloth_id="relnusa-legacy-latensi", sloth_service="relnusa-legacy", sloth_slo="latensi"} > (14.4 * 0.01)) without (sloth_window)
            and
