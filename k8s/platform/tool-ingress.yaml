# Host names for the tools. Open them through the SSH tunnel, for example
# http://jaeger.localhost:8080 . __LAB_DOMAIN__ is filled in by lab.sh.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jaeger
  namespace: observability
spec:
  ingressClassName: traefik
  rules:
    - host: jaeger.__LAB_DOMAIN__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: jaeger, port: {number: 16686}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chaos-dashboard
  namespace: chaos-mesh
spec:
  ingressClassName: traefik
  rules:
    - host: chaos.__LAB_DOMAIN__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: chaos-dashboard, port: {number: 2333}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rollouts-dashboard
  namespace: argo-rollouts
spec:
  ingressClassName: traefik
  rules:
    - host: rollouts.__LAB_DOMAIN__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: argo-rollouts-dashboard, port: {number: 3100}}
