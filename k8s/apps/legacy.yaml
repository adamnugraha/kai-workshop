# "Before": one application process and one database, both on the same
# node (zone-b). No cache, no queue, no timeout on the bank, and a
# stop-then-start deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-db
  namespace: legacy
  labels: {app: legacy-db}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: legacy-db}
  template:
    metadata:
      labels: {app: legacy-db}
    spec:
      nodeSelector:
        lab.relnusa.io/legacy: "true"
      tolerations:
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 15}
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 15}
      containers:
        - name: postgres
          image: postgres:17.10-alpine
          args: ["-c", "max_connections=100", "-c", "shared_buffers=128MB"]
          env:
            - {name: POSTGRES_USER, value: relnusa}
            - {name: POSTGRES_PASSWORD, value: relnusa}
            - {name: POSTGRES_DB, value: relnusa}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "relnusa"]}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: legacy-db
  namespace: legacy
spec:
  selector: {app: legacy-db}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monolith
  namespace: legacy
  labels: {app: monolith, app.kubernetes.io/part-of: relnusa}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: monolith}
  template:
    metadata:
      labels: {app: monolith, app.kubernetes.io/part-of: relnusa}
    spec:
      nodeSelector:
        lab.relnusa.io/legacy: "true"
      tolerations:
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 15}
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 15}
      terminationGracePeriodSeconds: 30
      containers:
        - name: monolith
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          args: ["monolith"]
          env:
            - {name: DATABASE_URL, value: "postgres://relnusa:relnusa@legacy-db:5432/relnusa?sslmode=disable"}
            - {name: BANK_URL, value: "http://banksim.bank.svc.cluster.local:8080"}
            - {name: DB_MAX_CONNS, value: "20"}
            - {name: SEARCH_DB_COST_MS, value: "25"}
            - {name: WARMUP_MS, value: "12000"}
            - {name: HOT_CAPACITY, value: "20000"}
            - {name: APP_VERSION, value: "v1"}
            - {name: SHUTDOWN_DRAIN_MS, value: "0"}
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
            - {name: OTEL_RESOURCE_ATTRIBUTES, value: "k8s.pod.name=$(POD_NAME),k8s.node.name=$(NODE_NAME),k8s.namespace.name=legacy"}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.observability:4318"}
            - {name: TRACE_SAMPLE_RATIO, value: "0.2"}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: "2", memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: monolith
  namespace: legacy
  labels: {app: monolith}
spec:
  selector: {app: monolith}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: legacy
  namespace: legacy
spec:
  ingressClassName: traefik
  rules:
    - host: legacy.__LAB_DOMAIN__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: monolith, port: {number: 80}}
