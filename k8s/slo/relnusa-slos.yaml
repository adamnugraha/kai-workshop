# Service level objectives for the RelNusa lab, in Sloth format.
# Generate the Prometheus rules with:   ./k8s/slo/generate.sh
#
# Availability and latency are measured at the edge (Traefik router
# metrics, which also count 503s when no pod is available), which is what
# a passenger experiences. Ticket issuance is measured at the payment
# worker, because a site can answer quickly while no tickets are issued.
apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: relnusa-modern
  namespace: observability
spec:
  service: "relnusa-modern"
  labels:
    architecture: modern
    team: relnusa
  slos:
    - name: "availability"
      objective: 99.9
      description: "Passenger requests answered without a server error (5xx) at the front door."
      sli:
        events:
          errorQuery: (sum(rate(traefik_router_requests_total{router=~"modern-app-.*",code=~"5.."}[{{.window}}])) or vector(0))
          totalQuery: sum(rate(traefik_router_requests_total{router=~"modern-app-.*"}[{{.window}}]))
      alerting:
        name: RelnusaModernAvailability
        labels:
          category: availability
        annotations:
          title: "Modern app availability is dropping"
          summary: "The availability error budget (target 99.9%) is being used much faster than normal."
          runbook: "Open Grafana RelNusa 2 (SLOs and error budgets), then RelNusa 3 to find the failing component."
        pageAlert:
          labels:
            severity: page
        ticketAlert:
          labels:
            severity: ticket
    - name: "latency"
      objective: 99
      description: "Passenger requests answered within 500 milliseconds."
      sli:
        events:
          errorQuery: |
            (
              sum(rate(traefik_router_request_duration_seconds_count{router=~"modern-app-.*"}[{{.window}}]))
              -
              sum(rate(traefik_router_request_duration_seconds_bucket{router=~"modern-app-.*",le="0.5"}[{{.window}}]))
            )
          totalQuery: sum(rate(traefik_router_request_duration_seconds_count{router=~"modern-app-.*"}[{{.window}}]))
      alerting:
        name: RelnusaModernLatency
        labels:
          category: latency
        annotations:
          title: "Modern app is slowing down"
          summary: "Too many requests are slower than 500 ms (target: 99% under 500 ms)."
        pageAlert:
          labels:
            severity: page
        ticketAlert:
          labels:
            severity: ticket
    - name: "ticket-issuance"
      objective: 99.9
      description: "Payment attempts that succeed, so the e-ticket is issued."
      sli:
        events:
          errorQuery: sum(rate(payment_attempts_total{namespace="modern",outcome!="success"}[{{.window}}]))
          totalQuery: sum(rate(payment_attempts_total{namespace="modern"}[{{.window}}]))
      alerting:
        name: RelnusaModernTicketIssuance
        labels:
          category: journey
        annotations:
          title: "E-tickets are not being issued"
          summary: "Payments to the bank are failing or delayed; passengers are not receiving e-tickets even though the site is still fast."
          runbook: "Check the bank and the circuit breaker on Grafana RelNusa 3 (Inside the modern architecture). Runbook: templates/alert-runbook.md"
        pageAlert:
          labels:
            severity: page
        ticketAlert:
          labels:
            severity: ticket
---
