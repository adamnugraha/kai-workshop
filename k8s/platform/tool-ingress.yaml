# Host names for the operator tools, for example http://jaeger.<domain>.
# __LAB_DOMAIN__ is filled in by lab.sh. Each one asks for the lab login
# (middleware in tool-auth.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jaeger
  namespace: observability
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: observability-lab-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: jaeger.__LAB_DOMAIN__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: jaeger, port: {number: 16686}}
---
